<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MACC Εξαγωγή Δεδομένων</title>
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1d2420; --muted: #5d6b63;
    --border: #d9dfdb; --accent: #2f7d4f; --accent-text: #ffffff; --error: #b3261e;
    --bar-bg: #e6ebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --card: #1d2320; --text: #e6ece8; --muted: #9aa8a0;
      --border: #333d38; --accent: #4fae76; --accent-text: #0d1410; --error: #f2857c;
      --bar-bg: #2a322e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  select, input {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; width: 100%;
  }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick button {
    font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;
  }
  button.primary {
    font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: default; }
  .hint { font-weight: 400; color: var(--muted); font-size: 13px; }
  #status { margin-top: 16px; min-height: 24px; }
  .bar { height: 8px; background: var(--bar-bg); border-radius: 999px; overflow: hidden; margin-bottom: 8px; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .error { color: var(--error); }
  @media (max-width: 420px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Εξαγωγή δεδομένων σταθμών</h1>
  <p class="sub">Κατέβασμα μετρήσεων σε CSV από το αντίγραφο της βάσης (όχι από το TagoIO).</p>

  <form id="f">
    <label>Σταθμός
      <select id="station" required><option value="">Φόρτωση…</option></select>
    </label>
    <div class="row">
      <label>Από <input type="date" id="from" required></label>
      <label>Έως <input type="date" id="to" required></label>
    </div>
    <div class="quick">
      <button type="button" data-days="1">Σήμερα</button>
      <button type="button" data-days="7">7 ημέρες</button>
      <button type="button" data-days="30">30 ημέρες</button>
      <button type="button" data-days="90">90 ημέρες</button>
      <button type="button" data-days="365">1 έτος</button>
    </div>
    <label>Μορφή CSV
      <select id="sep">
        <option value=";">Excel ελληνικό (; και δεκαδικό κόμμα)</option>
        <option value=",">Διεθνές (, και δεκαδική τελεία)</option>
      </select>
      <span class="hint">Οι ώρες στο αρχείο είναι σε ώρα Ελλάδας, με επιπλέον στήλη UTC.</span>
    </label>
    <button class="primary" id="go" type="submit">Κατέβασμα CSV</button>
  </form>

  <div id="status">
    <div class="bar" id="bar"><div></div></div>
    <div id="msg"></div>
  </div>
</main>

<script>
const TZ = 'Europe/Athens';
const CHUNK_DAYS = 7;   // κάθε κομμάτι χρόνου φέρνεται ξεχωριστά
const PARALLEL = 4;     // πόσα κομμάτια ταυτόχρονα

// Προτιμώμενη σειρά στηλών· ό,τι δεν είναι εδώ μπαίνει μετά αλφαβητικά.
const VAR_ORDER = ['air_temperature','air_humidity','dew_point','barometric_pressure_hpa','wind_speed_kmh','wind_speed_kmh2','peak_wind_gust_kmh','wind_direction_sensor','rain_gauge','rain_height','rain_height_acc','rain_height_hourly','rain_height_daily','rain_height_weekly','rain_height_monthly','rain_height_yearly','current_rain_height_daily','current_rain_height_weekly','current_rain_height_monthly','current_rain_height_yearly','uv_index','light_intensity','heat_index','wind_chill','thw_indexc','temperature','humidity','pressure','temp_soil','water_soil','conduct_soil','soil_moisture','soil_moisture1','soil_moisture2','soil_temperature1','soil_temperature2','conduct_soil1','conduct_soil2','pore_water_ec1','pore_water_ec2','soil_ph','leaf_moisture','leaf_temperature','bat'];

const $ = (id) => document.getElementById(id);
const msg = (html, cls = '') => { $('msg').className = cls; $('msg').innerHTML = html; };
const setBar = (frac) => { $('bar').style.display = 'block'; $('bar').firstElementChild.style.width = (frac * 100).toFixed(1) + '%'; };

// --- ημερομηνίες ---------------------------------------------------------
const athensFmt = new Intl.DateTimeFormat('sv-SE', {
  timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23',
});
const toAthens = (ms) => athensFmt.format(new Date(ms)).replace(',', '');   // "2026-11-23 11:49:22"
const todayAthens = () => toAthens(Date.now()).slice(0, 10);

// offset Αθήνας σε ms για συγκεκριμένη στιγμή
function athensOffset(ms) {
  const s = toAthens(ms);
  const asUtc = Date.parse(s.replace(' ', 'T') + 'Z');
  return asUtc - Math.floor(ms / 1000) * 1000;
}
// "2026-11-20" (μεσάνυχτα Αθήνας) -> ms UTC
function athensMidnight(ymd) {
  const guess = Date.parse(ymd + 'T00:00:00Z');
  let t = guess - athensOffset(guess);
  t = guess - athensOffset(t);
  return t;
}
const addDays = (ymd, n) => new Date(Date.parse(ymd + 'T12:00:00Z') + n * 86400000).toISOString().slice(0, 10);
const dbStamp = (ms) => new Date(ms).toISOString().slice(0, 19);   // UTC χωρίς Z, όπως στη βάση

function setRange(days) {
  const to = todayAthens();
  $('to').value = to;
  $('from').value = addDays(to, -(days - 1));
}

// --- φόρτωση δεδομένων -----------------------------------------------------
async function fetchChunk(station, fromMs, toMs, onRows) {
  let cursor = null;
  do {
    const p = new URLSearchParams({ station, from: dbStamp(fromMs), to: dbStamp(toMs) });
    if (cursor) { p.set('after_date', cursor.after_date); p.set('after_var', cursor.after_var); }
    let r, body;
    for (let attempt = 0; attempt < 3; attempt++) {
      r = await fetch('/api/data?' + p);
      body = await r.json().catch(() => ({ error: 'Μη έγκυρη απάντηση' }));
      if (r.ok) break;
      await new Promise((res) => setTimeout(res, 800 * (attempt + 1)));
    }
    if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
    onRows(body.rows);
    cursor = body.next;
  } while (cursor);
}

function buildCsv(byTime, vars, sep) {
  const dec = sep === ';' ? (v) => String(v).replace('.', ',') : (v) => String(v);
  const lines = [['Ώρα Ελλάδας', 'UTC', ...vars].join(sep)];
  const times = [...byTime.keys()].sort();
  for (const t of times) {
    const rec = byTime.get(t);
    const ms = Date.parse(t + 'Z');
    const cells = [toAthens(ms), t.slice(0, 19).replace('T', ' ')];
    for (const v of vars) cells.push(rec[v] === undefined || rec[v] === null ? '' : dec(rec[v]));
    lines.push(cells.join(sep));
  }
  return '﻿' + lines.join('\r\n') + '\r\n';
}

function orderVars(set) {
  const known = VAR_ORDER.filter((v) => set.has(v));
  const rest = [...set].filter((v) => !VAR_ORDER.includes(v)).sort();
  return [...known, ...rest];
}

async function run(e) {
  e.preventDefault();
  const station = $('station').value, from = $('from').value, to = $('to').value, sep = $('sep').value;
  if (!station || !from || !to) return;
  if (from > to) return msg('Η ημερομηνία «Από» είναι μετά την «Έως».', 'error');

  const start = athensMidnight(from), end = athensMidnight(addDays(to, 1));
  const chunks = [];
  for (let d = from; d <= to; d = addDays(d, CHUNK_DAYS)) {
    const s = athensMidnight(d);
    const nx = addDays(d, CHUNK_DAYS);
    chunks.push([s, Math.min(athensMidnight(nx), end)]);
  }

  $('go').disabled = true;
  const byTime = new Map();
  const vars = new Set();
  let done = 0, count = 0;
  setBar(0);
  msg('Φόρτωση…');
  const onRows = (rows) => {
    for (const [t, v, val] of rows) {
      let rec = byTime.get(t);
      if (!rec) { rec = {}; byTime.set(t, rec); }
      rec[v] = val;
      vars.add(v);
    }
    count += rows.length;
    msg(`Φόρτωση… ${count.toLocaleString('el-GR')} μετρήσεις`);
  };

  try {
    const queue = chunks.slice();
    const worker = async () => {
      while (queue.length) {
        const [s, t] = queue.shift();
        await fetchChunk(station, s, t, onRows);
        done++;
        setBar(done / chunks.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(PARALLEL, chunks.length) }, worker));

    if (!byTime.size) { msg('Δεν βρέθηκαν μετρήσεις για αυτό το διάστημα.'); return; }
    const csv = buildCsv(byTime, orderVars(vars), sep);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `${station}_${from}_${to}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    msg(`Έτοιμο: ${byTime.size.toLocaleString('el-GR')} γραμμές, ${vars.size} μεταβλητές.`);
  } catch (err) {
    msg('Σφάλμα: ' + err.message, 'error');
  } finally {
    $('go').disabled = false;
  }
}

// --- εκκίνηση --------------------------------------------------------------
document.querySelectorAll('.quick button').forEach((b) => b.addEventListener('click', () => setRange(+b.dataset.days)));
$('f').addEventListener('submit', run);
setRange(7);
fetch('/api/stations').then((r) => r.json()).then(({ stations }) => {
  $('station').innerHTML = '<option value="">— Επίλεξε σταθμό —</option>' +
    stations.map((s) => `<option value="${s}">${s}</option>`).join('');
}).catch(() => { $('station').innerHTML = '<option value="">Σφάλμα φόρτωσης</option>'; });
</script>
</body>
</html>
